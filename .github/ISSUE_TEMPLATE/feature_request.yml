name: Feature request
description: Suggest a new capability or a change to how Spool behaves.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Agree on the direction here before opening a pull request for a feature. See [CONTRIBUTING.md](https://github.com/doubletwisted/ComfyUI-Spool/blob/main/CONTRIBUTING.md).

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should Spool do instead?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds or alternatives
      description: How do you handle this now, and what else did you consider?
