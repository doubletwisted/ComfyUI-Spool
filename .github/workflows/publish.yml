name: Publish to Comfy Registry

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [pyproject.toml]

permissions:
  issues: write

jobs:
  publish:
    name: Publish to the Comfy Registry
    runs-on: ubuntu-latest
    if: github.repository_owner == 'doubletwisted'
    steps:
      - uses: actions/checkout@v4
      # Reviewed upstream main on 2026-11-07; re-review before updating.
      - uses: Comfy-Org/publish-node-action@d2366e7abb6ab16f3bb03e3520ae25c8cf749bc9
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
